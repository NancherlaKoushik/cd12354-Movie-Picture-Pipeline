name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t backend ./starter/backend

      - name: Run backend container
        run: docker run -d --name backend -p 5000:5000 backend

      - name: Test backend
        run: docker ps

      - name: Stop backend container
        if: always()
        run: docker stop backend || true